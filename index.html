<style>
:root{
  --bg:#F4F2ED; --surface:#FFFFFF; --surface-2:#ECE9E2;
  --ink:#15171C; --muted:#5D626C; --line:#D9D5CC; --trace:#CFCAC0;
  --accent:#E8590C; --accent-soft:rgba(232,89,12,.10); --ok:#2F9E6E;
  --radius:18px; --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  --sans:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1013; --surface:#16191E; --surface-2:#1D2127;
    --ink:#ECEDEF; --muted:#9AA0AA; --line:#2A2F37; --trace:#2B3038;
    --accent:#FF7A3D; --accent-soft:rgba(255,122,61,.12); --ok:#4CC38A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1013; --surface:#16191E; --surface-2:#1D2127;
  --ink:#ECEDEF; --muted:#9AA0AA; --line:#2A2F37; --trace:#2B3038;
  --accent:#FF7A3D; --accent-soft:rgba(255,122,61,.12); --ok:#4CC38A;
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit}
.wrap{max-width:1120px;margin:0 auto;padding:0 24px}
.mono{font-family:var(--mono);font-size:.78rem;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}

/* top bar */
.bar{position:sticky;top:0;z-index:20;backdrop-filter:saturate(1.4) blur(10px);background:color-mix(in srgb,var(--bg) 82%,transparent);border-bottom:1px solid transparent;transition:border-color .3s}
.bar.scrolled{border-color:var(--line)}
.bar .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:16px}
.logo{font-weight:800;letter-spacing:-.02em;text-decoration:none;display:flex;align-items:center;gap:10px}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 0 var(--ok);animation:ping 2.4s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}70%,100%{box-shadow:0 0 0 10px transparent}}
.nav{display:flex;gap:22px;font-size:.92rem;color:var(--muted)}
.nav a{text-decoration:none;transition:color .2s}
.nav a:hover{color:var(--ink)}
.tools{display:flex;gap:8px}
.chipbtn{font:500 .8rem var(--mono);border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:7px 12px;cursor:pointer;transition:border-color .2s,transform .2s}
.chipbtn:hover{border-color:var(--accent)}
.chipbtn:active{transform:scale(.96)}
.lang span{opacity:.4}.lang span.on{opacity:1;color:var(--accent)}
@media (max-width:820px){.nav{display:none}}

/* hero */
.hero{position:relative;padding:88px 0 72px;overflow:hidden}
.traces{position:absolute;right:-60px;top:20px;width:min(720px,90vw);height:auto;pointer-events:none;opacity:.9}
.traces path{fill:none;stroke:var(--trace);stroke-width:2;stroke-linecap:round;stroke-dasharray:var(--len);stroke-dashoffset:var(--len);animation:draw 2.6s cubic-bezier(.6,.1,.2,1) forwards}
.traces circle{fill:var(--bg);stroke:var(--trace);stroke-width:2;opacity:0;animation:fade .4s forwards}
.traces .pulse{fill:var(--accent);stroke:none;opacity:0;animation:fade .3s 2.4s forwards!important;filter:drop-shadow(0 0 6px var(--accent))}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fade{to{opacity:1}}
.hero .wrap{position:relative}
@media (max-width:820px){.traces{opacity:.45}}
.status{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;font-size:.85rem;color:var(--muted)}
.status b{width:8px;height:8px;border-radius:50%;background:var(--ok)}
h1{font-size:clamp(2.6rem,7vw,5.4rem);line-height:.98;letter-spacing:-.045em;font-weight:800;margin:26px 0 18px}
h1 .ln{display:block;overflow:hidden}
h1 .ln span{display:inline-block;transform:translateY(105%);animation:rise .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .ln:nth-child(2) span{animation-delay:.12s;color:var(--muted)}
@keyframes rise{to{transform:none}}
.role{font-size:clamp(1.15rem,2.4vw,1.5rem);font-weight:600;letter-spacing:-.01em;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.role em{font-style:normal;color:var(--accent)}
.lead{max-width:640px;color:var(--muted);font-size:1.08rem;margin-top:16px}
.cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:32px}
.btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:.95rem;border-radius:12px;padding:12px 18px;border:1px solid var(--line);background:var(--surface);transition:transform .2s,border-color .2s,background .2s}
.btn:hover{transform:translateY(-2px);border-color:var(--ink)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.primary:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn svg{width:17px;height:17px}
.meta{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:28px;color:var(--muted);font-size:.92rem}

/* stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);overflow:hidden}
.stat{padding:26px 24px;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat .n{font-size:2.6rem;font-weight:800;letter-spacing:-.04em;line-height:1}
.stat .n sup{font-size:1.2rem;color:var(--accent);vertical-align:top;margin-left:2px}
.stat p{color:var(--muted);font-size:.9rem;margin-top:8px;line-height:1.4}
@media (max-width:820px){.stats{grid-template-columns:1fr 1fr}.stat:nth-child(2){border-right:0}.stat:nth-child(-n+2){border-bottom:1px solid var(--line)}}

/* sections */
section{padding:96px 0 0}
.sh{display:flex;align-items:baseline;gap:16px;margin-bottom:12px}
.sh .idx{font-family:var(--mono);color:var(--accent);font-size:.85rem}
h2{font-size:clamp(1.8rem,4vw,2.6rem);letter-spacing:-.035em;line-height:1.1;font-weight:800}
.sub{color:var(--muted);max-width:640px;margin-bottom:40px}

/* lifecycle */
.flow{position:relative;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:36px 28px 28px}
.track{position:relative;display:grid;grid-template-columns:repeat(6,1fr);gap:12px}
.track::before{content:"";position:absolute;left:calc(100%/12);right:calc(100%/12);top:19px;height:2px;background:var(--line)}
.track .prog{position:absolute;left:calc(100%/12);top:19px;height:2px;width:0;background:var(--accent);transition:width 2.2s cubic-bezier(.6,.1,.2,1)}
.flow.in .track .prog{width:calc(100% - 100%/6)}
.stage{position:relative;text-align:center;padding:0 4px}
.dot{width:40px;height:40px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);font:500 .78rem var(--mono);color:var(--muted);position:relative;z-index:1;transition:border-color .4s,color .4s,background .4s}
.flow.in .dot{border-color:var(--accent);color:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.stage h4{font-size:.98rem;line-height:1.25;letter-spacing:-.01em}
.stage p{font-size:.82rem;color:var(--muted);margin-top:6px;line-height:1.4}
.loop{margin-top:28px;display:flex;align-items:center;gap:14px;padding:14px 18px;border-radius:12px;background:var(--accent-soft);font-size:.92rem}
.loop svg{flex:none;width:26px;height:26px;color:var(--accent)}
.loop svg.spin{animation:spin 6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (max-width:820px){
  .track{grid-template-columns:1fr;gap:18px}
  .track::before,.track .prog{left:19px;right:auto;top:20px;bottom:20px;width:2px;height:auto}
  .track .prog{height:0;transition:height 2.2s cubic-bezier(.6,.1,.2,1)}
  .flow.in .track .prog{width:2px;height:calc(100% - 40px)}
  .stage{display:grid;grid-template-columns:40px 1fr;gap:0 16px;text-align:left}
  .dot{grid-row:span 2;margin:0}
  .stage p{margin-top:2px}
}

/* strengths */
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:16px}
.card{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:24px;transition:transform .3s,border-color .3s}
.card:hover{transform:translateY(-4px);border-color:var(--accent)}
.card .ic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);margin-bottom:16px}
.card .ic svg{width:20px;height:20px}
.card h3{font-size:1.08rem;letter-spacing:-.015em;margin-bottom:6px}
.card p{color:var(--muted);font-size:.93rem;line-height:1.5}
@media (max-width:820px){.cards3{grid-template-columns:1fr}}

/* gantt */
.gantt{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:24px 24px 18px;margin-bottom:28px}
.g-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:12px;flex-wrap:wrap}
.g-legend{display:flex;gap:16px;font-size:.8rem;color:var(--muted)}
.g-legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.g-grid{position:relative}
.g-row{display:grid;grid-template-columns:210px 1fr;align-items:center;gap:16px;padding:9px 0;border-top:1px dashed var(--line);cursor:pointer}
.g-row:first-child{border-top:0}
.g-label{font-size:.88rem;line-height:1.25}
.g-label small{display:block;color:var(--muted);font-size:.78rem}
.g-lane{position:relative;height:28px}
.g-bar{position:absolute;top:4px;height:20px;border-radius:6px;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform 1.1s cubic-bezier(.6,.1,.2,1)}
.g-bar.cur{background:var(--accent)}
.gantt.in .g-bar{transform:scaleX(1)}
.g-row:hover .g-bar{filter:brightness(1.15)}
.g-axis{display:grid;grid-template-columns:210px 1fr;gap:16px;margin-top:6px}
.g-ticks{position:relative;height:20px;font:500 .72rem var(--mono);color:var(--muted)}
.g-ticks span{position:absolute;transform:translateX(-50%)}
.g-vlines{position:absolute;inset:0 0 0 226px;pointer-events:none}
.g-vlines i{position:absolute;top:0;bottom:0;width:1px;background:var(--line);opacity:.5}
@media (max-width:640px){
  .g-row,.g-axis{grid-template-columns:1fr;gap:6px}
  .g-vlines{left:0}
  .g-axis>div:first-child{display:none}
}

/* jobs */
.jobs{display:grid;gap:16px}
.job{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:28px;display:grid;grid-template-columns:240px 1fr;gap:28px;scroll-margin-top:90px;transition:border-color .3s}
.job.flash{border-color:var(--accent)}
.job .when{font:500 .8rem var(--mono);color:var(--muted)}
.job .co{font-size:1.4rem;font-weight:800;letter-spacing:-.03em;margin-top:6px}
.job .dur{display:inline-block;margin-top:8px;font:500 .75rem var(--mono);padding:3px 8px;border-radius:6px;background:var(--surface-2);color:var(--muted)}
.job .promo{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:.8rem;font-weight:600;color:var(--ok)}
.job h3{font-size:1.12rem;letter-spacing:-.015em;margin-bottom:12px}
.job ul{list-style:none;display:grid;gap:8px}
.job li{position:relative;padding-left:20px;color:var(--muted);font-size:.96rem;line-height:1.5}
.job li::before{content:"";position:absolute;left:0;top:.62em;width:8px;height:2px;background:var(--accent)}
.job li b{color:var(--ink);font-weight:600}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.tag{font:500 .74rem var(--mono);padding:4px 9px;border-radius:6px;border:1px solid var(--line);color:var(--muted)}
.tag.hw{border-color:color-mix(in srgb,var(--accent) 45%,transparent);color:var(--accent)}
@media (max-width:820px){.job{grid-template-columns:1fr;gap:14px;padding:22px}}

/* skills */
.skills{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.sk{border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);padding:24px}
.sk.wide{grid-column:1/-1}
.sk h3{font:500 .8rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:14px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{padding:7px 13px;border-radius:999px;background:var(--surface-2);font-size:.9rem;font-weight:500;transition:background .2s,color .2s}
.pill:hover{background:var(--ink);color:var(--bg)}
.pill.ai{background:var(--accent-soft);color:var(--accent)}
@media (max-width:820px){.skills{grid-template-columns:1fr}}

/* education */
.edu{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.edu .card .yr{font:500 .8rem var(--mono);color:var(--accent)}
.edu .card h3{font-size:1.25rem;margin-top:8px}
@media (max-width:820px){.edu{grid-template-columns:1fr}}

/* contact */
.contact{margin:96px 0 0;border-radius:24px;background:var(--ink);color:var(--bg);padding:56px 40px;position:relative;overflow:hidden}
.contact h2{font-size:clamp(2rem,5vw,3.4rem);max-width:720px}
.contact p{opacity:.7;margin-top:12px;max-width:560px}
.contact .cta .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent)}
.contact .cta .btn:hover{border-color:var(--accent);color:var(--accent)}
.contact .cta .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.contact .cta .btn.primary:hover{color:#fff;filter:brightness(1.08)}
.contact .glow{position:absolute;width:420px;height:420px;border-radius:50%;right:-120px;top:-160px;background:radial-gradient(circle,var(--accent) 0%,transparent 65%);opacity:.35;animation:drift 9s ease-in-out infinite alternate}
@keyframes drift{to{transform:translate(-80px,60px)}}
@media (max-width:640px){.contact{padding:40px 22px}}
footer{padding:36px 0 48px;color:var(--muted);font-size:.85rem;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}

/* reveal */
.rv{opacity:0;transform:translateY(22px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.8,.2,1)}
.rv.in{opacity:1;transform:none}

@media (max-width:480px){.wrap{padding:0 16px}.hero{padding-top:56px}body{font-size:16px}}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
  h1 .ln span,.rv{transform:none;opacity:1}
  .traces path{stroke-dashoffset:0}.traces circle{opacity:1}.traces .pulse{display:none}
  .g-bar{transform:none}
}
@media print{
  .bar,.traces,.cta,.contact .glow,.chipbtn{display:none!important}
  body{background:#fff;color:#000;font-size:12px}
  .rv{opacity:1;transform:none}
  section{padding-top:28px}
  .job,.card,.sk,.gantt,.flow{break-inside:avoid}
  .g-bar{transform:none}
  .contact{background:#fff;color:#000;border:1px solid #ccc}
}
</style>

}
function countUp(root){root.querySelectorAll(".cnt").forEach(el=>{const to=+el.dataset.to,t0=performance.now(),d=1200;
  const step=t=>{const k=Math.min(1,(t-t0)/d);el.textContent=Math.round(to*(1-Math.pow(1-k,3)));if(k<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

// trace lengths + staggered pads
document.querySelectorAll(".traces path").forEach((p,i)=>{p.style.setProperty("--len",Math.ceil(p.getTotalLength()));p.style.animationDelay=(i*.15)+"s"});
document.querySelectorAll(".traces circle:not(.pulse)").forEach((c,i)=>c.style.animationDelay=(1.4+i*.12)+"s");

$("#langBtn").onclick=()=>{lang=lang==="ua"?"en":"ua";store.set("lang",lang);
  const keep=new Set([...document.querySelectorAll(".in")].map(e=>e.id).filter(Boolean));render();
  document.querySelectorAll("#stats,#flow,#gantt").forEach(e=>{if(keep.has(e.id))e.classList.add("in")})};
const savedTheme=store.get("theme");if(savedTheme)document.documentElement.dataset.theme=savedTheme;
$("#themeBtn").onclick=()=>{const dark=document.documentElement.dataset.theme?document.documentElement.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;
  const next=dark?"light":"dark";document.documentElement.dataset.theme=next;store.set("theme",next)};
addEventListener("scroll",()=>$("#bar").classList.toggle("scrolled",scrollY>10),{passive:true});

render();
</script>
</body>
</html>
